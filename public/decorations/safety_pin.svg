<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" fill="none" class="safety-pin-svg">
  <defs>
    <filter id="pin-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.4)" />
    </filter>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="silver-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Shadow Group -->
  <g filter="url(#pin-shadow)">
    <!-- Back Wire -->
    <path d="M 40 50 L 75 220" stroke="url(#silver-metal)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Spring Coil at Bottom -->
    <circle cx="75" cy="225" r="14" stroke="url(#silver-metal)" stroke-width="5" fill="none" />
    <circle cx="75" cy="225" r="9" stroke="#334155" stroke-width="1.5" fill="none" opacity="0.4" />

    <!-- Front Needle Wire -->
    <path d="M 65 225 L 34 55" stroke="url(#silver-metal)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Needle specular highlight -->
    <path d="M 65 225 L 34 55" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

    <!-- Clasp Head / Cap -->
    <path d="M 22 20 C 22 12, 32 8, 44 8 C 56 8, 62 14, 62 25 L 58 65 C 58 72, 50 76, 42 76 C 32 76, 22 70, 22 62 Z" 
          fill="url(#silver-metal)" />
          
    <!-- Clasp Inner Slot / Fold -->
    <path d="M 28 26 C 28 18, 36 15, 45 15 C 52 15, 54 18, 54 26 L 50 56 C 50 62, 44 65, 38 65 C 30 65, 28 60, 28 54 Z" 
          fill="#475569" opacity="0.35" />

    <!-- Clasp Sheen Highlight -->
    <path d="M 26 22 C 26 14, 34 11, 42 11" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <ellipse cx="40" cy="26" rx="4" ry="7" fill="#ffffff" opacity="0.6" transform="rotate(-15 40 26)" />
  </g>
</svg>
